# Despliegue del servidor del índice de Aliado Libre.
# Arquitectura: modelo local (Ollama en el equipo del usuario) + índice en la nube.
# Antes de aplicar esto lee docs/DESPLIEGUE_INDICE.md: el índice pesa ~11GB,
# no está en git y hay que subirlo al disco persistente a mano una sola vez.
services:
  - type: web
    name: aliado-libre-indice
    runtime: docker
    # La búsqueda pica en 5,12 GB de RSS con el índice e5-large (medido: 3,97 GB
    # al cargar y 5,12 tras servir ocho consultas — el HNSW de Chroma se mapea a
    # memoria y crece al buscar, así que medir solo el arranque engaña).
    # MEDIDO el 7-sep-2026: el pico real es 5,12 GB, no 2,3. Pro son 4 GB y NO
    # alcanza; hay que subir de escalon (o bajar el pico por debajo de 4 GB,
    # que sale mas barato que pagarlo). Ver docs/DESPLIEGUE_INDICE.md.
    plan: pro
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /salud
    envVars:
      - key: PORT
        value: 8800
      # Secreto compartido con el cliente (index/cliente_remoto.py).
      # sync:false = se define a mano en el panel de Render, nunca en git.
      - key: ALIADO_INDICE_TOKEN
        sync: false
    disk:
      name: indice-legal
      # Montado en /datos, no en /app/index: el Dockerfile deja symlinks para
      # que index/buscar.py encuentre chroma_db/ y fts_index.db sin cambios.
      mountPath: /datos
      # Chroma ~19.1GB (sqlite 14.9 + vectores e5-large 3.0 + los del índice
      # viejo 1.2) + FTS5 ~1.55GB = ~20.7GB, más margen para reindexar.
      # Con e5-large los vectores son de 1024 dimensiones, no 384: los 15GB
      # que habia aqui se habrian quedado cortos en el propio despliegue.
      sizeGB: 30

# Servicio MCP anterior (opcional). Ahora que existe el servidor del índice,
# el MCP puede correr en el equipo del usuario contra el índice remoto en vez
