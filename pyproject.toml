[tool.ruff]
target-version = "py312"
line-length = 110
extend-exclude = ["venv", "data", "index/chroma_db"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP", "W"]
ignore = [
    "UP007",  # Optional[X] -> X | None: se deja como está en dataclasses ya validadas
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]      # tests ajustan sys.path antes de importar
"scripts/*" = ["E402"]
"index/*.py" = ["E402"]
"mcp_server/*.py" = ["E402"]
