# La version de Python NO es una preferencia de estilo: PyTorch y
# sentence-transformers hacen segfault en el 3.14 del sistema, y este proyecto
# los carga siempre que toca el indice. Queda declarado aqui para que sea
# comprobable por herramientas y no solo una advertencia en el README.
[project]
name = "aliado-libre"
version = "0.1.0"
description = "Busqueda y respuesta sobre legislacion y jurisprudencia colombiana, libre y sin registro de consultas"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110
# El comodin ".venv*" cubre tambien los entornos con sufijo (.venv312 y demas):
# sin el, ruff analiza el codigo de las dependencias instaladas y `make check`
# falla con errores que no son del proyecto.
extend-exclude = [
    "venv",
    ".venv*",
    "data",
    "index/chroma_db",
    "*.ipynb",
    "finetune/llama.cpp",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "UP", "W"]
ignore = [
    "UP007",  # Optional[X] -> X | None: se deja como está en dataclasses ya validadas
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]      # tests ajustan sys.path antes de importar
"scripts/*" = ["E402"]
"index/*.py" = ["E402"]
"mcp_server/*.py" = ["E402"]
"finetune/*.py" = ["E402"]  # scripts que ajustan sys.path antes de importar index/*
"finetune/_experimentos/*.py" = ["E402", "E501"]  # experimentos cumplidos: se conservan tal como se corrieron
"finetune/generar_dataset_ampliado.py" = ["E501"]
"finetune/generar_dataset_multifragmento.py" = ["E501"]
"finetune/evaluar.py" = ["E501"]
"finetune/diagnosticar_busqueda.py" = ["E501"]
"finetune/juzgar_respuestas.py" = ["E501"]
# Generadores de HTML: las lineas largas son plantillas, no codigo.
"finetune/generar_hoja_compartible.py" = ["E501"]
"generar_html_limpio_v2.py" = ["E501"]
